# Titas SCADA integration contract.
# The synthetic research dataset includes explicit well identity and physics
# variables. Replace source tags/units with the historian specification before
# connecting live data; never infer field well identity from segment numbers.
schema_version: 2
timezone: Asia/Dhaka
expected_frequency: 1min
resample: false

columns:
  timestamp: timestamp
  segment_id: segment_id
  well_id: well_id
  pressure: pressure
  flow_rate: flow_rate
  temperature: temperature
  valve_status: valve_status
  pump_state: pump_state
  pump_speed: pump_speed
  compressor_state: compressor_state
  energy_consumption: energy_consumption
  alarm_triggered: alarm_triggered
  event_type: event_type
  target: target
  wellhead_pressure_psia: wellhead_pressure_psia
  wellhead_temperature_f: wellhead_temperature_f
  flow_rate_mmscfd: flow_rate_mmscfd
  flowing_bottomhole_pressure_psia: flowing_bottomhole_pressure_psia

units:
  pressure: {source: bar, target: bar}
  flow_rate: {source: m3/s, target: m3/s}
  temperature: {source: C, target: C}
  pump_speed: {source: rpm, target: rpm}
  energy_consumption: {source: kW, target: kW}
  wellhead_pressure_psia: {source: psia, target: psia}
  wellhead_temperature_f: {source: F, target: F}
  flow_rate_mmscfd: {source: Mmscfd, target: Mmscfd}
  flowing_bottomhole_pressure_psia: {source: psia, target: psia}

ranges:
  pressure: {min: 0, max: 250}
  flow_rate: {min: 0, max: 1000}
  temperature: {min: -40, max: 100}
  pump_speed: {min: 0, max: 5000}
  energy_consumption: {min: 0, max: 10000}
  valve_status: {allowed: [0, 1, 2]}
  pump_state: {allowed: [0, 1]}
  compressor_state: {allowed: [0, 1]}
  alarm_triggered: {allowed: [0, 1]}
  wellhead_pressure_psia: {min: 0, max: 5000}
  wellhead_temperature_f: {min: -100, max: 500}
  flow_rate_mmscfd: {min: 0, max: 200}
  flowing_bottomhole_pressure_psia: {min: 0, max: 5000}

required_for_training:
  - timestamp
  - segment_id
  - well_id
  - pressure
  - flow_rate
  - temperature
  - valve_status
  - pump_state
  - pump_speed
  - compressor_state
  - energy_consumption
  - target
  - wellhead_pressure_psia
  - wellhead_temperature_f
  - flow_rate_mmscfd
  - flowing_bottomhole_pressure_psia

required_for_inference:
  - timestamp
  - segment_id
  - well_id
  - pressure
  - flow_rate
  - temperature
  - valve_status
  - pump_state
  - pump_speed
  - compressor_state
  - energy_consumption
  - wellhead_pressure_psia
  - wellhead_temperature_f
  - flow_rate_mmscfd
  - flowing_bottomhole_pressure_psia
